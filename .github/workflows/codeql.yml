name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }} (${{ matrix.os }})
    # Private repositories require an eligible GitHub Code Security license.
    # A skipped job is not a completed security analysis.
    if: github.event.repository.visibility == 'public' || vars.SECURITY_ANALYSIS_ENABLED == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-24.04
            build-mode: none
          - language: python
            os: ubuntu-24.04
            build-mode: none
          - language: actions
            os: ubuntu-24.04
            build-mode: none
          - language: c-cpp
            os: ubuntu-24.04
            build-mode: manual
          - language: c-cpp
            os: windows-2025
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compile Linux C and C++ sources for analysis
        if: matrix.language == 'c-cpp' && runner.os == 'Linux'
        run: |
          cc -Wall -Wextra -O2 scripts/debian-entry.c -o "$RUNNER_TEMP/debian-entry"
          cc -Wall -Wextra -O2 scripts/php-runtime-bootstrap.c -o "$RUNNER_TEMP/php-runtime-bootstrap"
          c++ -std=c++17 -Wall -Wextra -O2 examples/native-cpp/server.cpp -o "$RUNNER_TEMP/example-server"
      - name: Compile Windows C and C++ sources for analysis
        if: matrix.language == 'c-cpp' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual C++ tools were not found' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $build = Join-Path $env:RUNNER_TEMP 'codeql-build.cmd'
          @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W4 /DUNICODE /D_UNICODE scripts\process-runner-win.c /Fe:"$env:RUNNER_TEMP\process-runner.exe" /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /O2 /W4 examples\native-cpp\server.cpp /Fe:"$env:RUNNER_TEMP\example-server.exe"
          "@ | Set-Content -Path $build -Encoding ascii
          & cmd.exe /c $build
          if ($LASTEXITCODE -ne 0) { throw 'Native CodeQL build failed' }
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}/os:${{ matrix.os }}
