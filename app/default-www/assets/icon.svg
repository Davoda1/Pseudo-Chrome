  <circle cx="256" cy="256" r="130" fill="#FFFFFF"/>
  <path fill="#FFFFFF" fill-rule="evenodd" filter="url(#chrome-white-recess)" d="M256 128a128 128 0 1 1 0 256a128 128 0 1 1 0-256Z M256 154.7a101.3 101.3 0 1 1 0 202.6a101.3 101.3 0 1 1 0-202.6Z"/>
