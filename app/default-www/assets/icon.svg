    </clipPath>
    <filter id="chrome-inner-depth" x="-32" y="-32" width="576" height="576" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="soft-alpha"/>
      <feOffset in="soft-alpha" dx="-3" dy="-5" result="shadow-offset"/>
      <feComposite in="SourceAlpha" in2="shadow-offset" operator="out" result="shadow-mask"/>
      <feFlood flood-color="#000000" flood-opacity="0.30" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-mask" operator="in" result="inner-shadow"/>
      <feComposite in="inner-shadow" in2="SourceGraphic" operator="atop" result="shaded"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="highlight-alpha"/>
      <feOffset in="highlight-alpha" dx="2" dy="3" result="highlight-offset"/>
      <feComposite in="SourceAlpha" in2="highlight-offset" operator="out" result="highlight-mask"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.16" result="highlight-color"/>
      <feComposite in="highlight-color" in2="highlight-mask" operator="in" result="inner-highlight"/>
      <feComposite in="inner-highlight" in2="shaded" operator="atop"/>
    </filter>
    <filter id="chrome-white-recess" x="-32" y="-32" width="576" height="576" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="recess-soft-alpha"/>
      <feOffset in="recess-soft-alpha" dx="2.5" dy="3.5" result="recess-offset"/>
      <feComposite in="SourceAlpha" in2="recess-offset" operator="out" result="recess-mask"/>
